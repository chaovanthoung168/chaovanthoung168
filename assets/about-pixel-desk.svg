<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 112 40" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Pixel developer at a desk overlooking the city at night</title>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .eye {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: eye-blink 6s step-end infinite;
      }

      .cursor {
        animation: cursor-blink 1.4s step-end infinite;
      }
    }

    @keyframes eye-blink {
      0%, 97%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(.5); }
    }

    @keyframes cursor-blink {
      50% { opacity: 0; }
    }
  </style>

