<svg xmlns="http://www.w3.org/2000/svg" width="720" height="196" viewBox="0 0 720 196" role="img" aria-labelledby="title description">
  <title id="title">Software delivery flow</title>
  <desc id="description">A browser window, a cloud, and a line chart show three stages in order: build, deploy, and monitor.</desc>

  <style>
    svg {
      --surface: #eaf2ff;
      --grid: #c5d6ed;
      --node: #fff;
      --ink: #182e58;
      --accent: #2854c5;
      --signal: #087969;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #151f36;
        --grid: #35496c;
        --node: #202f4c;
        --ink: #e4ecff;
        --accent: #a5bcff;
        --signal: #77dfc6;
      }
    }

    text {
      fill: var(--ink);
      font: 600 25px "Trebuchet MS", system-ui, sans-serif;
      text-anchor: middle;
    }
  </style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="var(--grid)"/>
    </pattern>
  </defs>

  <rect width="720" height="196" rx="18" fill="var(--surface)"/>
  <rect width="720" height="196" rx="18" fill="url(#grid)" opacity=".65"/>

  <!-- Paths between stages -->
  <g fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M197 92h95m-10-7 10 7-10 7M435 92h92m-10-7 10 7-10 7"/>
    <path d="M200 102h67m170 0h65" stroke-dasharray="2 7" opacity=".5"/>
  </g>

  <!-- Build -->
  <g stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="75" y="44" width="120" height="89" rx="10" fill="var(--node)"/>
    <path d="M75 65h120" fill="none"/>
    <path d="M89 55h.1m10 0h.1m10 0h.1" stroke-width="4"/>
    <path d="m116 88-10 10 10 10m38-20 10 10-10 10m-15-25-8 30" fill="none"/>
  </g>
  <text x="135" y="172">Build</text>

  <!-- Deploy -->
  <g fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M328 119a22 22 0 0 1-1-44 33 33 0 0 1 63-1 23 23 0 1 1 3 45z" fill="var(--node)"/>
    <path d="M360 104V74m-11 11 11-11 11 11" stroke="var(--signal)"/>
  </g>
  <text x="360" y="172">Deploy</text>

  <!-- Monitor -->
  <g fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="535" y="44" width="110" height="89" rx="10" fill="var(--node)"/>
    <path d="M550 61v54h80" stroke="var(--grid)"/>
    <path d="m554 105 17-14 16 6 18-26 17 8" stroke="var(--signal)"/>
    <circle cx="622" cy="79" r="3.5" fill="var(--signal)" stroke="none"/>
  </g>
  <text x="590" y="172">Monitor</text>
</svg>
